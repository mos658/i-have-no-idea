<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio Button with Image</title>
  <style>
    body {
      text-align: center;
      padding-top: 50px;
      font-family: Arial, sans-serif;
    }

    #playButton {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    img {
      width: 300px;
      height: auto;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <button id="playButton">Play Audio</button>
  <br><br>
  <img src="your-image.jpg" alt="Your Image Here">

  <audio id="audio" src="your-audio.mp3"></audio>

  <script>
    const button = document.getElementById("playButton");
    const audio = document.getElementById("audio");

    button.addEventListener("click", () => {
      audio.play();
    });
  </script>

</body>
</html>
